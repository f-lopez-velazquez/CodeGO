name: Publish lightweight codeGO update

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Resumen breve visible en GitHub (opcional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  verify-and-build:
    name: Verify code and build the small update
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:electron
      - run: npm run test:browser
      - run: npm run audit
      - run: npm run build:patch
      - uses: actions/upload-artifact@v4
        with:
          name: lightweight-update
          path: dist/patch/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish update and preserve base installers
    needs: verify-and-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: lightweight-update
          path: release-assets
      - name: Validate version and copy the latest compatible base installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La versión $TAG ya está publicada." >&2
            exit 1
          fi
          BASE_TAG=""
          while read -r CANDIDATE; do
            [ -z "$CANDIDATE" ] && continue
            ASSETS=$(gh release view "$CANDIDATE" --json assets --jq '.assets[].name')
            if grep -q -- '-setup-x64.exe$' <<<"$ASSETS" \
              && grep -q -- '-linux-x64.AppImage$' <<<"$ASSETS" \
              && grep -q -- '-mac-arm64.dmg$' <<<"$ASSETS" \
              && grep -q -- '-mac-x64.dmg$' <<<"$ASSETS"; then
              BASE_TAG="$CANDIDATE"
              break
            fi
          done < <(gh release list --limit 30 --json tagName --jq '.[].tagName')
          if [ -z "$BASE_TAG" ]; then
            echo 'No existe una versión base con instaladores para todos los sistemas.' >&2
            exit 1
          fi
          gh release download "$BASE_TAG" --dir release-assets \
            --pattern 'CodeGO-*-setup-x64.exe' \
            --pattern 'CodeGO-*-portable-x64.exe' \
            --pattern 'CodeGO-*-linux-x64.AppImage' \
            --pattern 'CodeGO-*-mac-arm64.dmg' \
            --pattern 'CodeGO-*-mac-arm64.zip' \
            --pattern 'CodeGO-*-mac-x64.dmg' \
            --pattern 'CodeGO-*-mac-x64.zip'
          (cd release-assets && sha256sum CodeGO-* > SHA256SUMS.txt)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BASE_TAG=$BASE_TAG" >> "$GITHUB_ENV"
      - name: Create lightweight GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          cat > release-notes.md <<EOF
          ## codeGO v${VERSION}

          ${NOTES:-Actualización de estabilidad y experiencia de edición.}

          La aplicación instalada descarga únicamente el paquete de código verificado, de aproximadamente 1–3 MB. El entorno Python, las librerías educativas y Electron permanecen en el equipo. Si la nueva interfaz no termina de abrir, codeGO restaura automáticamente la versión anterior.

          Los instaladores completos adjuntos corresponden a la base compatible ${BASE_TAG}; al abrirse, reciben esta actualización ligera automáticamente.

          ---
          © 2026 Francisco López Velázquez · [zolvek.com.mx](https://zolvek.com.mx)
          EOF
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" \
            --title "codeGO v${VERSION} — Actualización oficial" \
            --notes-file release-notes.md --latest
