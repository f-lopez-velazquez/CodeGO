name: Prepare signed release artifacts
on:
  workflow_dispatch:
    inputs:
      hardware_report:
        description: 'URL HTTPS del acta de aceptación en equipos físicos para esta revisión'
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  package:
    needs: verify
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux }
          - { os: windows-2022, platform: win32 }
          - { os: macos-14, platform: darwin }
          - { os: macos-15-intel, platform: darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Record release provenance and hardware acceptance
        env:
          HARDWARE_REPORT: ${{ inputs.hardware_report }}
        run: |
          node -e "const fs=require('fs'); const url=new URL(process.env.HARDWARE_REPORT); if(url.protocol!=='https:')throw Error('Se requiere el acta de aceptación'); fs.mkdirSync('reports',{recursive:true}); fs.writeFileSync('reports/release-provenance.json',JSON.stringify({version:require('./package.json').version,commit:process.env.GITHUB_SHA,runner:process.env.RUNNER_OS,hardwareReport:url.href},null,2));"
      - run: npm run audit
      - name: Build Linux
        if: matrix.platform == 'linux'
        run: npm run build:release
      - name: Build and sign Windows
        if: matrix.platform == 'win32'
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run build:release
      - name: Prepare Apple API key
        if: matrix.platform == 'darwin'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          node -e "const fs=require('fs'); const path=require('path'); const key=process.env.APPLE_API_KEY_CONTENT; if(!key)throw Error('Missing Apple API key'); fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'apple-api-key.p8'),key,{mode:0o600});"
      - name: Build, sign and notarize macOS
        if: matrix.platform == 'darwin'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run build:release
      - run: npm run test:packaged
      - name: Remove temporary signing key
        if: always() && matrix.platform == 'darwin'
        run: node -e "require('fs').rmSync(require('path').join(process.env.RUNNER_TEMP,'apple-api-key.p8'),{force:true});"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-*.txt
            reports/
          if-no-files-found: error
          retention-days: 30
