name: Build & Release codeGO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Crear GitHub Release con los instaladores'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    name: Build — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,    platform: linux,  artifact: linux }
          - { os: windows-2022,    platform: win32,  artifact: win }
          - { os: macos-14,        platform: darwin, artifact: mac-arm64 }
          - { os: macos-15-intel,  platform: darwin, artifact: mac-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Assemble verified offline Python and wheelhouse
        run: npm run prepare:offline

      - name: Install and microtest the offline bundle
        run: npm run test:offline

      - name: Install Linux runtime libraries
        if: matrix.platform == 'linux'
        run: npx playwright install-deps chromium

      # ---------- Linux ----------
      - name: Build Linux (AppImage + tar.gz)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux AppImage tar.gz --x64 --publish never

      # ---------- Windows ----------
      - name: Build Windows (NSIS Setup + Portable)
        if: matrix.platform == 'win32'
        run: npx electron-builder --win nsis portable --x64 --publish never

      # ---------- macOS (ARM / Intel) ----------
      - name: Build macOS (DMG + ZIP)
        if: matrix.platform == 'darwin'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          ARCH=$([[ "${{ matrix.artifact }}" == "mac-arm64" ]] && echo "arm64" || echo "x64")
          npx electron-builder --mac dmg zip --$ARCH --publish never

      - name: Test packaged application
        env:
          CODEGO_REQUIRE_OFFLINE_BUNDLE: '1'
        run: npm run test:packaged

      - name: Install or extract deliverable and test it
        run: node scripts/installer-smoke.cjs

      - name: Assemble normalized downloads and checksums
        run: node scripts/prepare-downloads.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          path: downloads/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: installers-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          cat > release-notes.md <<EOF
          ## codeGO v${VERSION}

          Entorno educativo de Python para aprender, practicar y evaluar con una experiencia consistente en el aula.

          - **Preparación incluida**: Python 3.13 y las herramientas educativas viajan dentro del instalador.
          - **Comprobación previa**: importaciones, gráficos, archivos, entrada interactiva y comunicación serial antes de abrir el editor.
          - **Ventanas gráficas visibles**: mejor integración con Pygame y otros entornos gráficos, incluida la ubicación automática en Hyprland.
          - **Errores para aprender**: explicación clara, detección de línea y acceso directo al código.
          - **Correcciones guiadas**: causas específicas, pasos concretos y un ejemplo válido para los errores frecuentes de Python.
          - **Edición asistida**: guías de sangría por bloque, nivel actual, comprobación de sintaxis en vivo, salto exacto con F8, pares automáticos y sangría o desangría de bloques.
          - **Continuidad de trabajo**: al volver desde Inicio, el archivo activo recupera el foco y queda editable de inmediato.
          - **Foco de escritorio**: Electron recupera el teclado también en Wayland/Hyprland, sin obligar a ejecutar y detener un programa.
          - **Feedback claro**: diálogos propios, confirmaciones sonoras discretas y hora exacta de la última versión guardada.
          - **Carpeta del proyecto**: abre el trabajo actual directamente en Explorer, Finder o el gestor de archivos de Linux.
          - **Interfaz académica**: preparación adaptable, consejos útiles y lenguaje dirigido al usuario final.
          - **Proyectos desde el inicio**: abre una carpeta existente o crea un proyecto vacío; no se impone un archivo inicial.
          - **Explorador organizado**: mueve archivos y carpetas mediante arrastre, incluso entre subcarpetas.
          - **Librerías simples**: instala por nombre desde la aplicación y observa el progreso sin salir del proyecto.
          - **Tarea / actividad supervisada**: portapapeles disponible, recursos PDF e imagen, avisos repetibles al cambiar de aplicación y entrega con sello Ed25519.
          - **Proyectos recientes**: abre directamente hasta tres carpetas usadas recientemente sin volver a mostrar el selector del sistema.
          - **Examen limpio por ID**: crea un espacio aislado y un archivo vacío con el nombre del alumno y el ID dictado en el aula.
          - **Detención resistente**: termina el árbol completo de procesos ante ciclos infinitos, procesos hijos e inundaciones de salida sin bloquear la interfaz.
          - **Supervisión precisa**: cierra navegadores y asistentes conocidos al iniciar el examen; cada salida reactiva sonido y una señal roja, blanca y verde. Al regresar comienza de nuevo la espera completa de 12 segundos.
          - **Calificación trazable**: genera una huella Ed25519 vinculada al SHA-256 exacto del examen entregado.
          - **macOS guiado**: firma de forma ad hoc los componentes internos y muestra una solución copiable si Gatekeeper conserva la cuarentena.
          - **Revisión de grupos**: compara sellos, duplicados y similitud estructural entre todas las entregas seleccionadas.
          - **Tres modos**: Examen, Tarea / Actividad supervisada y Modo libre con controles independientes.
          - **PIN del docente**: cada examen usa un PIN definido al comenzar o una política administrada; no existe una clave universal incluida.
          - **Inicio estable**: una pantalla de preparación mantiene la aplicación sensible mientras revisa el equipo y una sola instancia evita el parpadeo de ventanas duplicadas.
          - **Actualización automática**: comprueba en segundo plano, valida SHA-256 y aplica el paquete nativo cuando no hay una sesión activa.
          - **Pantalla estable**: evita la negociación repetida de pantalla completa en Wayland/Hyprland y muestra siempre la versión instalada en el inicio.

          ### Instalación
          | Plataforma | Archivo | Notas |
          |---|---|---|
          | Windows | \`CodeGO-${VERSION}-setup-x64.exe\` | Instalador NSIS |
          | Windows portable | \`CodeGO-${VERSION}-portable-x64.exe\` | Sin instalación |
          | macOS Apple Silicon | \`CodeGO-${VERSION}-mac-arm64.dmg\` | macOS 13+ |
          | macOS Intel | \`CodeGO-${VERSION}-mac-x64.dmg\` | macOS 13+ |
          | Linux | \`CodeGO-${VERSION}-linux-x64.AppImage\` | Linux x64 compatible |

          El primer inicio extrae y valida el entorno incluido; puede tardar varios minutos y no requiere internet. Ver \`SHA256SUMS.txt\` para verificar integridad.

          macOS todavía no está notarizado. Si Gatekeeper bloquea la primera apertura después de mover codeGO a Aplicaciones, ejecuta:

          \`\`\`bash
          xattr -dr com.apple.quarantine "/Applications/codeGO.app" && open "/Applications/codeGO.app"
          \`\`\`

          ---
          © 2026 Francisco López Velázquez · [zolvek.com.mx](https://zolvek.com.mx)
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "codeGO v${VERSION} — Versión oficial" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" release-assets/* --title "codeGO v${VERSION} — Versión oficial" --notes-file release-notes.md --latest
          fi
