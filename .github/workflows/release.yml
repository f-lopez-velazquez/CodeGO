name: Build & Release v1.0.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Crear GitHub Release con los instaladores'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

jobs:
  build:
    name: Build — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,    platform: linux,  artifact: linux }
          - { os: windows-2022,    platform: win32,  artifact: win }
          - { os: macos-14,        platform: darwin, artifact: mac-arm64 }
          - { os: macos-13,        platform: darwin, artifact: mac-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      # ---------- Linux ----------
      - name: Build Linux (AppImage + tar.gz)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux AppImage tar.gz --x64

      # ---------- Windows ----------
      - name: Build Windows (NSIS Setup + Portable)
        if: matrix.platform == 'win32'
        run: npx electron-builder --win nsis portable --x64

      # ---------- macOS (ARM / Intel) ----------
      - name: Build macOS (DMG + ZIP)
        if: matrix.platform == 'darwin'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          ARCH=$([[ "${{ matrix.artifact }}" == "mac-arm64" ]] && echo "arm64" || echo "x64")
          npx electron-builder --mac dmg zip --$ARCH

      # ---------- Upload artifacts ----------
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum *.AppImage *.tar.gz *.exe *.dmg *.zip 2>/dev/null > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          gh release create "$TAG" release-assets/* \
            --title "CodeGO ExamGuard v${VERSION} — Versión Oficial" \
            --notes "## CodeGO ExamGuard v${VERSION}

          Entorno educativo de Python multiplataforma con tres modos:

          - 🛡️ **Modo Examen Blindado**: Kiosk, Wi-Fi off, alerta estroboscópica 12s, entrega ZIP+SHA256
          - 📦 **Modo Tarea Certificada**: Bloqueo C/P, telemetría forense, entrega .codego HMAC-SHA256
          - 📘 **Modo Actividad Libre**: Editor completo con árbol jerárquico de carpetas

          ### Instalación
          | Plataforma | Archivo | Notas |
          |---|---|---|
          | Windows | \`CodeGO-${VERSION}-setup-x64.exe\` | Instalador NSIS |
          | Windows portable | \`CodeGO-${VERSION}-portable-x64.exe\` | Sin instalación |
          | macOS Apple Silicon | \`CodeGO-${VERSION}-mac-arm64.dmg\` | macOS 13+ |
          | macOS Intel | \`CodeGO-${VERSION}-mac-x64.dmg\` | macOS 13+ |
          | Linux | \`CodeGO-${VERSION}-linux-x86_64.AppImage\` | Cualquier distro |

          Ver \`SHA256SUMS.txt\` para verificar integridad.

          ---
          © 2026 Francisco López Velázquez · [zolvek.com.mx](https://zolvek.com.mx)" \
            --latest
