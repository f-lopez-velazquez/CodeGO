name: Build public preview installers for codeGO
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linux }
          - { os: windows-2022, target: win }
          - { os: macos-14, target: mac }
          - { os: macos-15-intel, target: mac }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DEBUG: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run prepare:offline
      - run: npm run test:offline
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Build preview without developer certificates
        run: npm run build:${{ matrix.target }} -- --publish never
      - run: npm run test:packaged
        env:
          CODEGO_REQUIRE_OFFLINE_BUNDLE: '1'
      - name: Check smaller display with OS scaling
        if: runner.os == 'Linux'
        env:
          CODEGO_TEST_SCREEN: '1280,720'
          CODEGO_TEST_SCALE: '1.5'
        run: npm run test:packaged
      - name: Install or extract the deliverable and test it
        run: node scripts/installer-smoke.cjs
      - name: Assemble downloads, checksums and provenance
        run: node scripts/prepare-downloads.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: downloads-${{ matrix.os }}
          path: downloads/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@v4
        with:
          pattern: downloads-*
          path: all-downloads
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-preview.1"
          echo "Publicando release $TAG..."
          cd all-downloads
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          NOTES="codeGO $VERSION incluye Python 3.13 y 28 librerías para preparar el aula sin internet, proyectos vacíos o existentes, explorador con arrastre, soporte Arduino/ESP32 y terminal interactiva con input(). Desarrollado por Francisco López Velázquez · zolvek.com.mx"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber
            gh release edit "$TAG" --title "codeGO $VERSION · Vista previa pública" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" * --title "codeGO $VERSION · Vista previa pública" --notes "$NOTES" --prerelease
          fi
